<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日语口语进步追踪</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-title" content="口语私教台">
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --panel2: #0b1120; --border: #334155;
    --text: #f1f5f9; --muted: #94a3b8; --accent: #38bdf8;
    --success: #34d399; --warning: #fbbf24; --danger: #f87171;
    --s-grammar: #38bdf8; --s-keigo: #a78bfa; --s-logic: #34d399; --s-fluency: #fbbf24; --s-pronunciation: #f472b6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; padding: 18px 16px 40px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  h1 { font-size: 1.25rem; }
  header .sub { font-size: 0.8rem; color: var(--muted); }
  a.btn { color: var(--text); background: var(--panel); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card h2 { font-size: 0.98rem; color: var(--accent); margin-bottom: 4px; }
  .card .hint { font-size: 0.8rem; color: var(--muted); margin-bottom: 12px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .stat .label { font-size: 0.78rem; color: var(--muted); }
  .stat .value { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .delta { font-size: 0.78rem; }
  .up { color: var(--success); } .down { color: var(--danger); } .flat { color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .legend button { font: inherit; font-size: 0.78rem; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 99px; padding: 2px 10px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .legend button.off { opacity: 0.35; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  #chart { width: 100%; height: 260px; display: block; }
  .tag-row { display: grid; grid-template-columns: minmax(130px, 210px) 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px dashed var(--border); cursor: pointer; }
  .tag-row:last-child { border-bottom: none; }
  .tag-row:hover .tag-name { color: var(--accent); }
  .bar-bg { background: var(--panel2); border-radius: 4px; height: 14px; overflow: hidden; }
  .bar { height: 100%; background: var(--danger); border-radius: 4px; }
  .tag-meta { font-size: 0.78rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tag-examples { grid-column: 1 / -1; display: none; font-size: 0.85rem; background: var(--panel2); border-radius: 8px; padding: 8px 12px; cursor: default; }
  .tag-row.open .tag-examples { display: block; }
  .ex { padding: 6px 0; border-bottom: 1px solid #1e293b; }
  .ex:last-child { border-bottom: none; }
  .bad { color: #fca5a5; } .good { color: #6ee7b7; font-weight: 600; } .why { color: #cbd5e1; font-size: 0.8rem; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  select, input { font: inherit; font-size: 0.85rem; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
  details.rec { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; margin-bottom: 8px; }
  details.rec summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 0.86rem; }
  details.rec summary::-webkit-details-marker { display: none; }
  .ts { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.8rem; }
  .chip { border: 1px solid var(--border); border-radius: 99px; padding: 0 8px; font-size: 0.74rem; color: var(--muted); }
  .chip.tag { border-color: #7f1d1d; color: #fca5a5; }
  .score { border-radius: 99px; padding: 0 7px; font-size: 0.74rem; border: 1px solid; font-variant-numeric: tabular-nums; }
  .rec-body { margin-top: 10px; font-size: 0.88rem; display: flex; flex-direction: column; gap: 8px; }
  .rec-body .k { font-size: 0.76rem; color: var(--muted); }
  .jp { font-size: 0.98rem; }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 20px 0; text-align: center; }
  .grid2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
  #focus li { margin: 0 0 8px 18px; font-size: 0.88rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>📈 我的日语口语进步 & 问题追踪</h1>
      <div class="sub" id="srcInfo">读取中...</div>
    </div>
    <a class="btn" href="/">🏠 今日面板</a>
  </header>

  <div class="stats" id="stats"></div>

  <div class="grid2">
    <div class="card">
      <h2>分数走势（每天平均，1–10）</h2>
      <div class="hint">只统计新版有评分的练习；点下面的标签可以隐藏/显示某一项。</div>
      <div class="legend" id="legend"></div>
      <svg id="chart" viewBox="0 0 600 260" preserveAspectRatio="none" role="img" aria-label="每日平均分走势"></svg>
    </div>
    <div class="card">
      <h2>🎯 下次练习重点</h2>
      <div class="hint">根据最近 14 天出现最多、还没改掉的问题自动生成。</div>
      <ul id="focus"></ul>
    </div>
  </div>

  <div class="card">
    <h2>高频问题（错题本）</h2>
    <div class="hint">每次批改由 AI 从 12 类固定问题里打标签。点某一行查看你的原话和修改。“近 14 天 / 更早”帮助判断是否在改善。</div>
    <div id="tags"></div>
  </div>

  <div class="card">
    <h2>全部练习记录</h2>
    <div class="filters">
      <select id="fTag"><option value="">全部问题类型</option></select>
      <select id="fScenario"><option value="">全部场景</option></select>
      <select id="fMachine"><option value="">全部电脑</option></select>
      <input id="fText" placeholder="搜索原话 / 问题..." style="flex:1; min-width:160px;">
    </div>
    <div id="records"></div>
  </div>
</div>

<script>
const SCEN = { bank: '面试题库', scene: '生活场景', interview_unit: '面试单元', daily_push: '今日推送', chem_rd: '化企 R&D', it_ai_ds: 'AI/数据科学', quant_finance: '量化金融', custom: '自定义' };
const SCORE_COLORS = { grammar: 'var(--s-grammar)', keigo: 'var(--s-keigo)', logic: 'var(--s-logic)', fluency: 'var(--s-fluency)', pronunciation: 'var(--s-pronunciation)' };
let DATA = null;
const hidden = new Set();

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function day(r) { return (r.timestamp || '').slice(0, 10); }
function avg(a) { return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; }
function overall(r) { const v = Object.values(r.scores || {}); return avg(v); }
function scoreColor(v) { return v >= 8 ? 'var(--success)' : v >= 6 ? 'var(--warning)' : 'var(--danger)'; }
function ymd(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function daysAgo(d, n) { const t = new Date(); t.setDate(t.getDate() - n); return d >= ymd(t); }

async function load() {
  const res = await fetch('/api/progress');
  DATA = await res.json();
  const machines = [...new Set(DATA.records.map(r => r.machine).filter(Boolean))];
  document.getElementById('srcInfo').textContent =
    `记录目录：${DATA.record_dir}（OneDrive 同步，三台电脑共用）· 本机：${DATA.machine} · 已有记录来自：${machines.join('、') || '—'}`;
  renderStats(); renderLegend(); renderChart(); renderTags(); renderFocus(); initFilters(); renderRecords();
}

function renderStats() {
  const recs = DATA.records;
  const days = [...new Set(recs.map(day))].sort();
  let streak = 0;
  const t = new Date();
  for (let i = 0; i < 400; i++) {
    const d = new Date(t); d.setDate(t.getDate() - i);
    const ds = ymd(d);
    if (days.includes(ds)) streak++; else if (i > 0) break;
  }
  const week = recs.filter(r => daysAgo(day(r), 6)).length;
  const scored = recs.filter(r => overall(r) !== null);
  const last = scored.slice(-10).map(overall), prev = scored.slice(-20, -10).map(overall);
  const la = avg(last), pa = avg(prev);
  let delta = '<span class="flat">再练几次就能看到对比</span>';
  if (la !== null && pa !== null) {
    const d = la - pa;
    delta = d > 0.05 ? `<span class="up">▲ ${d.toFixed(1)} 比之前 10 次</span>` : d < -0.05 ? `<span class="down">▼ ${(-d).toFixed(1)} 比之前 10 次</span>` : '<span class="flat">与之前持平</span>';
  }
  const audio = recs.filter(r => r.input_type === 'audio').length;
  document.getElementById('stats').innerHTML = [
    ['累计练习', recs.length + ' 次', `其中录音 ${audio} 次`],
    ['练习天数', days.length + ' 天', days.length ? `首次 ${days[0]}` : ''],
    ['连续打卡', streak + ' 天', streak ? '今天也来练一句吧' : '今天还没练'],
    ['最近 7 天', week + ' 次', ''],
    ['最近 10 次平均分', la !== null ? la.toFixed(1) : '—', delta],
  ].map(([l, v, d]) => `<div class="stat"><div class="label">${l}</div><div class="value">${v}</div><div class="delta">${d}</div></div>`).join('');
}

function renderLegend() {
  document.getElementById('legend').innerHTML = Object.entries(DATA.score_keys).map(([k, label]) =>
    `<button data-k="${k}" class="${hidden.has(k) ? 'off' : ''}"><span class="dot" style="background:${SCORE_COLORS[k]}"></span>${label}</button>`).join('');
  document.querySelectorAll('#legend button').forEach(b => b.onclick = () => {
    const k = b.dataset.k; hidden.has(k) ? hidden.delete(k) : hidden.add(k); renderLegend(); renderChart();
  });
}

function renderChart() {
  const svg = document.getElementById('chart');
  const byDay = {};
  DATA.records.forEach(r => { if (Object.keys(r.scores || {}).length) (byDay[day(r)] ||= []).push(r); });
  const days = Object.keys(byDay).sort();
  if (!days.length) { svg.innerHTML = '<text x="300" y="130" text-anchor="middle" fill="#94a3b8" font-size="14">还没有带评分的练习，练一次就会出现走势</text>'; return; }
  const W = 600, H = 260, L = 28, R = 10, T = 10, B = 26;
  const x = i => days.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (days.length - 1);
  const y = v => T + (10 - v) * (H - T - B) / 9;
  let g = '';
  for (let v = 1; v <= 10; v += 3) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#334155" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" fill="#94a3b8" font-size="11">${v}</text>`;
  const step = Math.ceil(days.length / 6);
  days.forEach((d, i) => { if (i % step === 0 || i === days.length - 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" fill="#94a3b8" font-size="11">${d.slice(5)}</text>`; });
  Object.keys(DATA.score_keys).forEach(k => {
    if (hidden.has(k)) return;
    const pts = days.map((d, i) => { const v = avg(byDay[d].map(r => r.scores[k]).filter(n => typeof n === 'number')); return v === null ? null : [x(i), y(v), v, d]; }).filter(Boolean);
    if (!pts.length) return;
    g += `<polyline fill="none" stroke="${SCORE_COLORS[k]}" stroke-width="2" points="${pts.map(p => p[0] + ',' + p[1]).join(' ')}" vector-effect="non-scaling-stroke"/>`;
    pts.forEach(p => g += `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${SCORE_COLORS[k]}"><title>${DATA.score_keys[k]} ${p[3]}：${p[2].toFixed(1)}</title></circle>`);
  });
  svg.innerHTML = g;
}

function tagStats() {
  const st = {};
  Object.keys(DATA.tags).forEach(k => st[k] = { total: 0, recent: 0, older: 0, recs: [] });
  DATA.records.forEach(r => (r.problem_tags || []).forEach(t => {
    if (!st[t]) return;
    st[t].total++; daysAgo(day(r), 13) ? st[t].recent++ : st[t].older++; st[t].recs.push(r);
  }));
  return Object.entries(st).filter(([, v]) => v.total).sort((a, b) => b[1].recent - a[1].recent || b[1].total - a[1].total);
}

function renderTags() {
  const list = tagStats();
  const el = document.getElementById('tags');
  if (!list.length) { el.innerHTML = '<div class="empty">还没有问题标签。新版每次批改都会自动打标签。</div>'; return; }
  const max = Math.max(...list.map(([, v]) => v.total));
  el.innerHTML = list.map(([k, v]) => {
    const exs = v.recs.slice(-5).reverse().map(r => {
      const errs = (r.error_breakdown || []).slice(0, 2).map(e => `<div class="bad">${esc(e.original_part)}</div><div class="good">${esc(e.fixed_part)}</div><div class="why">${esc(e.reason_cn)}</div>`).join('');
      return `<div class="ex"><span class="ts">${esc(r.timestamp)}</span> ${errs || `<div class="why">${esc(r.user_transcript)}</div>`}</div>`;
    }).join('');
    return `<div class="tag-row" data-k="${k}">
      <span class="tag-name">${esc(DATA.tags[k])}</span>
      <div class="bar-bg"><div class="bar" style="width:${(v.total / max * 100).toFixed(0)}%"></div></div>
      <span class="tag-meta">共 ${v.total} · 近14天 ${v.recent} / 更早 ${v.older}</span>
      <div class="tag-examples">${exs}</div></div>`;
  }).join('');
  el.querySelectorAll('.tag-row').forEach(row => row.addEventListener('click', e => { if (!e.target.closest('.tag-examples')) row.classList.toggle('open'); }));
}

function renderFocus() {
  const list = tagStats().filter(([, v]) => v.recent > 0).slice(0, 3);
  const el = document.getElementById('focus');
  if (!list.length) { el.innerHTML = '<li style="list-style:none; margin-left:0; color:var(--muted)">最近 14 天没有重复出现的问题——继续保持，或者去挑战更难的场景。</li>'; return; }
  const used = new Set();
  el.innerHTML = list.map(([k, v]) => {
    let e = null;
    for (const r of v.recs.slice().reverse()) {
      e = (r.error_breakdown || []).find(x => !used.has(x.original_part));
      if (e) break;
    }
    if (e) used.add(e.original_part);
    return `<li><b>${esc(DATA.tags[k])}</b>（近 14 天 ${v.recent} 次）${e ? `<br><span class="bad">${esc(e.original_part)}</span> → <span class="good">${esc(e.fixed_part)}</span>` : ''}</li>`;
  }).join('');
}

function initFilters() {
  const fTag = document.getElementById('fTag'), fS = document.getElementById('fScenario'), fM = document.getElementById('fMachine');
  Object.entries(DATA.tags).forEach(([k, v]) => fTag.insertAdjacentHTML('beforeend', `<option value="${k}">${esc(v)}</option>`));
  [...new Set(DATA.records.map(r => r.scenario).filter(Boolean))].forEach(s => fS.insertAdjacentHTML('beforeend', `<option value="${esc(s)}">${esc(SCEN[s] || s)}</option>`));
  [...new Set(DATA.records.map(r => r.machine).filter(Boolean))].forEach(m => fM.insertAdjacentHTML('beforeend', `<option value="${esc(m)}">${esc(m)}</option>`));
  ['fTag', 'fScenario', 'fMachine', 'fText'].forEach(id => document.getElementById(id).addEventListener('input', renderRecords));
}

function renderRecords() {
  const tag = document.getElementById('fTag').value, sc = document.getElementById('fScenario').value,
        m = document.getElementById('fMachine').value, q = document.getElementById('fText').value.trim().toLowerCase();
  const list = DATA.records.filter(r =>
    (!tag || (r.problem_tags || []).includes(tag)) && (!sc || r.scenario === sc) && (!m || r.machine === m) &&
    (!q || ((r.user_transcript || '') + (r.question || '')).toLowerCase().includes(q))).slice().reverse();
  const el = document.getElementById('records');
  if (!list.length) { el.innerHTML = '<div class="empty">没有符合条件的记录。</div>'; return; }
  el.innerHTML = list.slice(0, 200).map(r => {
    const scores = Object.entries(r.scores || {}).map(([k, v]) => `<span class="score" style="color:${scoreColor(v)}; border-color:${scoreColor(v)}">${esc(DATA.score_keys[k] || k)} ${v}</span>`).join(' ');
    const tags = (r.problem_tags || []).map(t => `<span class="chip tag">${esc(DATA.tags[t] || t)}</span>`).join(' ');
    const errs = (r.error_breakdown || []).map(e => `<div><span class="bad">${esc(e.original_part)}</span><br><span class="good">${esc(e.fixed_part)}</span><div class="why">${esc(e.reason_cn)}</div></div>`).join('');
    const pron = (r.unclear_pronunciations || []).map(u => `<div><span class="bad">${esc(u.heard_as)}</span> → <span class="good">${esc(u.target_word)}</span> <span class="why">${esc(u.tip_cn)}</span></div>`).join('');
    return `<details class="rec"><summary>
        <span class="ts">${esc(r.timestamp)}</span>
        <span class="chip">${esc(SCEN[r.scenario] || r.scenario || '')}</span>
        <span class="chip">${r.input_type === 'audio' ? '🎙 录音' : r.input_type === 'text' ? '⌨ 文字' : '旧版'}</span>
        <span class="chip">${esc(r.machine || '')}</span>
        ${scores} ${tags}
        <span style="color:#cbd5e1; flex-basis:100%;">${esc(r.one_line_progress_cn || (r.user_transcript || '').slice(0, 70) + '…')}</span>
      </summary>
      <div class="rec-body">
        ${r.question ? `<div><div class="k">面试官的问题</div><div class="jp">${esc(r.question)}</div></div>` : ''}
        <div><div class="k">我的原话</div><div class="jp">${esc(r.user_transcript)}</div></div>
        ${errs ? `<div><div class="k">逐处修改</div>${errs}</div>` : ''}
        ${pron ? `<div><div class="k">发音问题</div>${pron}</div>` : ''}
        ${r.own_words_version ? `<div><div class="k">保留自己说法的修改版（第 ${r.stage} 阶段）</div><div class="jp">${esc(r.own_words_version)}</div></div>` : ""}
        ${r.executive_keigo_rewrite ? `<div><div class="k">面试级改写</div><div class="jp">${esc(r.executive_keigo_rewrite)}</div></div>` : ''}
        ${r.critique_cn ? `<div><div class="k">总体点评</div>${esc(r.critique_cn)}</div>` : ''}
      </div></details>`;
  }).join('');
}

load().catch(e => { document.getElementById('srcInfo').textContent = '读取失败：' + e.message; });
</script>
</body>
</html>
